[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance-ai"
version = "0.1.0"
description = "Predictive Maintenance AI - IoT anomaly detection and failure prediction on NASA C-MAPSS"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "hp" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "xgboost>=2.0", "joblib>=1.3", "pyarrow>=15.0"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D203", "D213", "D401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
